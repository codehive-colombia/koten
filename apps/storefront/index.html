<!doctype html>
<html lang="ja" data-theme="chirashi" data-density="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="HIKARI K-1: cámara compacta de fotograma completo, objetivo fijo de 35 mm y 380 g."
    />
    <title>HIKARI K-1 · Storefront</title>
    <script>
      // Sumi antes del primer paint; el hook mantiene el resto del estado (F5-002).
      (() => {
        const params = new URLSearchParams(location.search);
        const root = document.documentElement;
        if (params.get("theme") === "sumi") root.dataset.theme = "sumi";
        const lang = params.get("lang");
        if (["es", "ja", "en"].includes(lang)) root.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
