name: koten

services:
  web:
    image: ${KOTEN_IMAGE:-koten:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${KOTEN_SITE_URL:-https://koten.codehive.com.co}
        KOTEN_SITE_URL: ${KOTEN_SITE_URL:-https://koten.codehive.com.co}
    restart: unless-stopped
    # Traefik reaches the container over the Docker network, so nothing is
    # published on the host. Publishing 3000/3001/3002 would only collide with
    # other services on the server. For local checks use docker-compose.local.yml.
    expose:
      - "3000"
      - "3001"
      - "3002"
    labels:
      traefik.enable: "true"

      # / · catalog and documentation
      traefik.http.routers.koten-docs.rule: "Host(`${KOTEN_HOST:-koten.codehive.com.co}`)"
      traefik.http.routers.koten-docs.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.koten-docs.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.routers.koten-docs.priority: "1"
      traefik.http.routers.koten-docs.service: "koten-docs"
      traefik.http.services.koten-docs.loadbalancer.server.port: "3000"

      # /demos/store · HIKARI storefront
      traefik.http.routers.koten-store.rule: "Host(`${KOTEN_HOST:-koten.codehive.com.co}`) && PathPrefix(`/demos/store`)"
      traefik.http.routers.koten-store.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.koten-store.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.routers.koten-store.priority: "10"
      traefik.http.routers.koten-store.service: "koten-store"
      traefik.http.services.koten-store.loadbalancer.server.port: "3001"

      # /demos/erp · KURA ERP
      traefik.http.routers.koten-erp.rule: "Host(`${KOTEN_HOST:-koten.codehive.com.co}`) && PathPrefix(`/demos/erp`)"
      traefik.http.routers.koten-erp.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.koten-erp.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.routers.koten-erp.priority: "10"
      traefik.http.routers.koten-erp.service: "koten-erp"
      traefik.http.services.koten-erp.loadbalancer.server.port: "3002"

# When Dokploy does not attach the service to Traefik's network automatically,
# add it to the service and declare the external network:
#
#    networks:
#      - default
#      - traefik
#
# networks:
#   traefik:
#     external: true
#     name: ${TRAEFIK_NETWORK:-dokploy-network}
