# Koten UI production runtime (D-043).
#
# The same image serves three static applications on three ports. Traefik keeps
# the path prefix, so the storefront and ERP assets are requested under
# /demos/store/* and /demos/erp/* respectively.

server_tokens off;
absolute_redirect off;

# Agents that ask for Markdown get the twin of the page (D-058).
map $http_accept $koten_markdown {
  default 0;
  ~*text/markdown 1;
}

# Markdown twin advertised in the Link header of every catalog page.
map $request_uri $koten_md_twin {
  "/" "/md/index.md";
  ~^(?<koten_path>[^?]*) "/md$koten_path.md";
  default "/md/index.md";
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/markdown
  text/css
  application/javascript
  application/json
  application/xml
  image/svg+xml;

# 3000 · catalog and documentation, mounted at the domain root.
server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /r/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }

  # Agent documentation (D-045, D-058): static Markdown generated at build time.
  location = /llms.txt {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=300";
    add_header Link '</llms.txt>; rel="llms-txt"';
  }

  location = /llms-full.txt {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=300";
    add_header Link '</llms.txt>; rel="llms-txt"';
  }

  location = /robots.txt {
    charset utf-8;
    add_header Cache-Control "public, max-age=300";
  }

  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=300";
  }

  # Markdown twin of a page: /components/button.md -> /md/components/button.md
  location ~ ^/(?<koten_md>.+)\.md$ {
    rewrite ^/(?<koten_md>.+)\.md$ /md/$koten_md.md last;
  }

  location ^~ /md/ {
    types {
      text/markdown md;
    }
    charset utf-8;
    charset_types text/markdown;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
    add_header Vary Accept;
    add_header Link '</llms.txt>; rel="llms-txt"';
  }

  location / {
    # Markdown negotiation: /components/button + Accept: text/markdown.
    if ($koten_markdown) {
      rewrite ^/$ /md/index.md last;
    }
    if ($koten_markdown) {
      rewrite ^ /md$uri.md last;
    }

    # `$uri.html` serves the static agent page written by build-agent-pages.ts.
    try_files $uri $uri.html $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Vary Accept;
    add_header Link '</llms.txt>; rel="llms-txt"';
    add_header Link "<$koten_md_twin>; rel=\"alternate\"; type=\"text/markdown\"";
  }
}

# 3001 · storefront, mounted at /demos/store.
server {
  listen 3001;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    return 302 /demos/store/;
  }

  location = /demos/store {
    return 301 /demos/store/;
  }

  location /demos/store/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /demos/store/ {
    try_files $uri $uri/ /demos/store/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    return 404;
  }
}

# 3002 · ERP, mounted at /demos/erp.
server {
  listen 3002;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    return 302 /demos/erp/;
  }

  location = /demos/erp {
    return 301 /demos/erp/;
  }

  location /demos/erp/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /demos/erp/ {
    try_files $uri $uri/ /demos/erp/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    return 404;
  }
}
