# Koten UI production runtime (D-043).
#
# The same image serves three static applications on three ports. Traefik keeps
# the path prefix, so the storefront and ERP assets are requested under
# /demos/store/* and /demos/erp/* respectively.

server_tokens off;
absolute_redirect off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/markdown
  text/css
  application/javascript
  application/json
  application/xml
  image/svg+xml;

# 3000 · catalog and documentation, mounted at the domain root.
server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /r/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }

  # Agent documentation (D-045): static Markdown generated at build time.
  location = /llms.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=300";
  }

  location = /llms-full.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=300";
  }

  location /md/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

# 3001 · storefront, mounted at /demos/store.
server {
  listen 3001;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    return 302 /demos/store/;
  }

  location = /demos/store {
    return 301 /demos/store/;
  }

  location /demos/store/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /demos/store/ {
    try_files $uri $uri/ /demos/store/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    return 404;
  }
}

# 3002 · ERP, mounted at /demos/erp.
server {
  listen 3002;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    return 302 /demos/erp/;
  }

  location = /demos/erp {
    return 301 /demos/erp/;
  }

  location /demos/erp/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /demos/erp/ {
    try_files $uri $uri/ /demos/erp/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    return 404;
  }
}
